name: task worker portability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Task-worker tests on supported developer platforms
        run: go test -count=1 -short -run 'TestTaskWorker|TestFailingTaskWorkerTool' ./cmd/seat-runner
