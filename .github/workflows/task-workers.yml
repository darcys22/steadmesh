name: task workers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Unit tests
        run: go test -short ./...
      - name: Task worker and branching PostgreSQL integration
        run: go test -count=1 -tags integration -run 'TestTask|TestRunBranch|TestBranchTools' -timeout 10m ./services/store ./services/platform
      - name: Website references
        run: python3 hack/site.py check
