name: ACP isolated conformance
on:
  pull_request:
    paths:
      - 'harnesses/acp/**'
      - 'harnesses/conformance/**'
      - 'harnesses/modelforward/**'
      - 'harnesses/modelstub/**'
      - 'cmd/steadmesh-tools/**'
      - 'build/acp-conformance.Dockerfile'
      - '.github/workflows/acp-conformance.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'harnesses/acp/**'
      - 'build/acp-conformance.Dockerfile'
      - '.github/workflows/acp-conformance.yml'
permissions:
  contents: read
jobs:
  pinned-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned test-only runtime
        run: docker build --platform linux/amd64 -f build/acp-conformance.Dockerfile -t steadmesh-acp-conformance .
      - name: Run real ACP against local fixtures without external network
        # No host mounts, secrets, privileged mode, extra capabilities or relaxed
        # seccomp profile. Only /tmp is writable. Native sandboxing stays enabled.
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m steadmesh-acp-conformance
