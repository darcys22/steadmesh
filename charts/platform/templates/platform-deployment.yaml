{{- include "steadmesh.representativeGateway.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steadmesh-platform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
    steadmesh.io/component: platform
spec:
  replicas: {{ .Values.platform.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: steadmesh-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steadmesh-platform
        # Seat NetworkPolicies allow egress only to Pods with this label.
        steadmesh.io/component: platform
    spec:
      serviceAccountName: steadmesh-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        {{- if .Values.representativeGateway.enabled }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: "{{ .Values.image.platformRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: LISTEN_ADDR
              value: ":8080"
            {{- if .Values.representativeGateway.enabled }}
            - name: REPRESENTATIVE_LISTEN_ADDR
              value: {{ printf ":%d" (int .Values.representativeGateway.port) | quote }}
            - name: REPRESENTATIVE_CONFIG_FILE
              value: /etc/steadmesh/representative/gateway.json
            {{- end }}
            - name: CONTROLLER_USERNAME
              value: "system:serviceaccount:{{ .Release.Namespace }}:steadmesh-controller"
            {{- if .Values.console.enabled }}
            # Serve the read-only /console/v1 API to the console only.
            - name: CONSOLE_USERNAME
              value: "system:serviceaccount:{{ .Release.Namespace }}:steadmesh-console"
            {{- end }}
            - name: SECRETS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.credentials.ledgerSecretName }}
            - name: CREDENTIAL_LEDGER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.ledgerSecretName | quote }}
                  key: {{ .Values.credentials.ledgerSecretKey | quote }}
            {{- end }}
            - name: CREDENTIAL_REFRESH_INTERVAL
              value: {{ .Values.credentials.refreshInterval | quote }}
            - name: CREDENTIAL_GRACE
              value: {{ .Values.credentials.grace | quote }}
            - name: CREDENTIAL_MAX_STALE
              value: {{ .Values.credentials.maxStale | quote }}
            - name: RETIREMENT_GRACE
              value: {{ .Values.retirement.grace | quote }}
            {{- if .Values.vault.enabled }}
            - name: VAULT_ADDR
              value: {{ required "vault.address is required when vault.enabled" .Values.vault.address | quote }}
            - name: VAULT_ROLE
              value: {{ .Values.vault.role | quote }}
            - name: VAULT_MOUNT
              value: {{ .Values.vault.mount | quote }}
            - name: VAULT_JWT_PATH
              value: {{ .Values.vault.jwtPath | quote }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            {{- if .Values.representativeGateway.enabled }}
            - name: representative
              containerPort: {{ .Values.representativeGateway.port }}
          volumeMounts:
            # Mount the directory, not a subPath: projected Secret updates
            # must be visible to per-request authentication and revocation.
            - name: representative-config
              mountPath: /etc/steadmesh/representative
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
          securityContext:
            {{- include "steadmesh.securityContext" . | nindent 12 }}
      {{- if .Values.representativeGateway.enabled }}
      volumes:
        - name: representative-config
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.representativeGateway.existingSecret | quote }}
                  items:
                    - key: gateway.json
                      path: gateway.json
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: steadmesh-platform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
    steadmesh.io/component: platform
spec:
  selector:
    app.kubernetes.io/name: steadmesh-platform
  ports:
    - name: http
      port: 8080
      targetPort: http
