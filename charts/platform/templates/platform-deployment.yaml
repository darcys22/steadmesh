apiVersion: apps/v1
kind: Deployment
metadata:
  name: steadmesh-platform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
    steadmesh.io/component: platform
spec:
  replicas: {{ .Values.platform.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: steadmesh-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steadmesh-platform
        # Seat NetworkPolicies allow egress only to Pods with this label.
        steadmesh.io/component: platform
    spec:
      serviceAccountName: steadmesh-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: "{{ .Values.image.platformRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: CONTROLLER_USERNAME
              value: "system:serviceaccount:{{ .Release.Namespace }}:steadmesh-controller"
            - name: SECRETS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.vault.enabled }}
            - name: VAULT_ADDR
              value: {{ required "vault.address is required when vault.enabled" .Values.vault.address | quote }}
            - name: VAULT_ROLE
              value: {{ .Values.vault.role | quote }}
            - name: VAULT_MOUNT
              value: {{ .Values.vault.mount | quote }}
            - name: VAULT_JWT_PATH
              value: {{ .Values.vault.jwtPath | quote }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
          securityContext:
            {{- include "steadmesh.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: steadmesh-platform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
    steadmesh.io/component: platform
spec:
  selector:
    app.kubernetes.io/name: steadmesh-platform
  ports:
    - name: http
      port: 8080
      targetPort: http
