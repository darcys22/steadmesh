apiVersion: apps/v1
kind: Deployment
metadata:
  name: steadmesh-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
    steadmesh.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: steadmesh-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steadmesh-controller
        steadmesh.io/component: controller
    spec:
      serviceAccountName: steadmesh-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.image.controllerRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --platform-url={{ include "steadmesh.platformURL" . }}
            - --control-plane-namespace={{ .Release.Namespace }}
            - --seat-image-pull-policy={{ .Values.controller.seatImagePullPolicy }}
            - --netprobe-image={{ .Values.controller.netprobeImage }}
            - --netprobe-denied-url={{ .Values.controller.netprobeDeniedURL }}
            - --dns-namespace={{ .Values.controller.dnsNamespace }}
            {{- if .Values.egress.enabled }}
            - --egress-url=http://steadmesh-egress.{{ .Release.Namespace }}.svc:{{ .Values.egress.port }}
            {{- end }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect={{ .Values.controller.leaderElect }}
            - --leader-election-namespace={{ .Release.Namespace }}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- include "steadmesh.securityContext" . | nindent 12 }}
