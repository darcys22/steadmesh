apiVersion: v1
kind: ServiceAccount
metadata:
  name: steadmesh-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
    steadmesh.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: steadmesh-controller
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
rules:
  - apiGroups: ["steadmesh.io"]
    resources: ["agentorganizations", "agentseats"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["steadmesh.io"]
    resources: ["agentorganizations/status", "agentseats/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["steadmesh.io"]
    resources: ["agentorganizations/finalizers", "agentseats/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "serviceaccounts", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: steadmesh-controller
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: steadmesh-controller
subjects:
  - kind: ServiceAccount
    name: steadmesh-controller
    namespace: {{ .Release.Namespace }}
---
# Leader election lease in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: steadmesh-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: steadmesh-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "steadmesh.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: steadmesh-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: steadmesh-controller
    namespace: {{ .Release.Namespace }}
