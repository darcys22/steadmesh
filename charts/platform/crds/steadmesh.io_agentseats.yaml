                - claimName
                type: object
            required:
            - configRevision
            - executionProfile
            - harnessProfile
            - manifestConfigMap
            - organizationID
            - organizationName
            - sandboxProfile
            - seatID
            - seatKey
            - workspace
            type: object
          status:
            properties:
              adoptedRevision:
                type: string
              backendRef:
                description: BackendRef identifies the backend instance (e.g. statefulset/<name>).
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              executionState:
                description: ExecutionState is the technical execution state of a
                  seat (§6.2).
                type: string
              lastActivityTime:
                format: date-time
                type: string
              lastError:
                description: LastError is redacted.
                type: string
              latestCheckpoint:
                description: LatestCheckpoint describes the latest recovery checkpoint
                  and its guarantee.
                type: string
              leaseGeneration:
                format: int64
                type: integer
              observedGeneration:
                format: int64
                type: integer
              probe:
                description: Probe is the synthetic readiness probe of the current
                  config revision.
                properties:
                  completedTime:
                    format: date-time
                    type: string
                  detail:
                    type: string
                  id:
                    type: string
                  nonce:
                    description: Nonce is the verify-request nonce the probe answered,
                      if any.
                    type: string
                  revision:
                    description: Revision is the config revision the probe verified.
                    type: string
                  startedTime:
                    format: date-time
                    type: string
                  status:
                    description: Status is pending, passed or failed.
                    type: string
                required:
                - id
                - revision
                - status
                type: object
              retiringUntil:
                description: RetiringUntil is the end of a retiring seat's grace period.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
