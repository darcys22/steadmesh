---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agentseats.steadmesh.io
spec:
  group: steadmesh.io
  names:
    kind: AgentSeat
    listKind: AgentSeatList
    plural: agentseats
    shortNames:
    - aseat
    singular: agentseat
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.seatKey
      name: Seat
      type: string
    - jsonPath: .status.executionState
      name: State
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentSeat is a controller-owned persistent seat.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSeatSpec is generated by the controller from the organisation.
            properties:
              adminSuspended:
                description: AdminSuspended is an infrastructure control that stops
                  execution (§14).
                type: boolean
              configRevision:
                type: string
              executionProfile:
                type: string
              harnessProfile:
                type: string
              manifestConfigMap:
                description: ManifestConfigMap holds the resolved seat manifest and
                  instruction texts.
                type: string
              organizationID:
                type: string
              organizationName:
                type: string
              retired:
                description: |-
                  Retired is set when the seat is removed from the organisation. The
                  seat keeps running while the platform reports it retiring, then its
                  runtime is removed.
                type: boolean
              sandboxProfile:
                type: string
              seatID:
                description: SeatID is the immutable durable identity of the seat.
                type: string
              seatKey:
                type: string
              tools:
                items:
                  description: |-
                    ToolCapability is one entry of a seat's effective tool manifest. It contains
                    no secret values.
                  properties:
                    operations:
                      items:
                        type: string
                      type: array
                    resource:
                      type: string
                    targets:
                      items:
                        type: string
                      type: array
                  required:
                  - operations
                  - resource
                  type: object
                type: array
              workspace:
                properties:
                  claimName:
                    description: ClaimName is the seat's persistent workspace claim.
                    type: string
                  shared:
                    items:
                      type: string
                    type: array
